<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1RM 계산기</title>
  <link rel="stylesheet" href="./bmi.css">
  <script defer src="./bmi.js"></script>
</head>
<body>

  <section class="box" id="orm-section">
    <h1>1RM 계산기</h1>
    <hr />

    <label>무게 (kg)</label>
    <input type="number" id="inputORMWeight" placeholder="예: 60">
    <br /><br />

    <label>반복 횟수</label>
    <input type="number" id="inputORMReps" placeholder="예: 8">
    <br /><br />

    <button onclick="calcORM();">계산하기</button>

    <div id="resultORM">결과가 여기에 표시됩니다</div>

    <table id="rmTable" border="1"></table>
  </section>

</body>
</html>
